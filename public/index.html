<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>세미온 디펜스 - 협동 타워 디펜스</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 타이틀 화면 -->
  <section id="screen-title" class="screen active">
    <div class="title-box">
      <h1>⚔️ 세미온 디펜스 🔮</h1>
      <p class="sub">직업을 고르고, 친구와 시너지를 맞춰 30웨이브를 막아내세요</p>
      <input id="in-name" maxlength="12" placeholder="닉네임" autocomplete="off" />
      <button id="btn-create" class="primary">방 만들기</button>
      <div class="join-row">
        <input id="in-code" maxlength="4" placeholder="방 코드" autocomplete="off" />
        <button id="btn-join">참가</button>
      </div>
      <p class="hint">연결이 끊기면 같은 방 코드 + 같은 닉네임으로 다시 들어오면 됩니다.</p>
    </div>
  </section>

  <!-- 로비 -->
  <section id="screen-lobby" class="screen">
    <div class="lobby">
      <div class="lobby-head">
        <h2>방 코드 <span id="lobby-code" class="code"></span></h2>
        <button id="btn-copy" class="small">초대 링크 복사</button>
      </div>
      <div id="lobby-players" class="lobby-players"></div>
      <h3>직업 선택</h3>
      <div id="class-cards" class="class-cards"></div>
      <div class="lobby-actions">
        <button id="btn-ready">준비</button>
        <button id="btn-start" class="primary">게임 시작</button>
      </div>
      <p id="lobby-msg" class="hint"></p>
    </div>
  </section>

  <!-- 게임 -->
  <section id="screen-game" class="screen">
    <div class="game-layout">
      <header id="hud" class="hud">
        <div class="hud-item">🌊 <b id="hud-wave">0</b>/<span id="hud-maxwave"></span></div>
        <div class="hud-item">❤️ <b id="hud-life">0</b></div>
        <div class="hud-item">💰 <b id="hud-gold">0</b></div>
        <div class="hud-item" id="hud-phase"></div>
        <button id="btn-wave-ready" class="small">준비 (R)</button>
        <div id="hud-players" class="hud-players"></div>
      </header>
      <main class="game-main">
        <div class="canvas-wrap">
          <canvas id="canvas"></canvas>
          <div id="tooltip" class="tooltip hidden"></div>
          <div id="toast" class="toast hidden"></div>
        </div>
        <aside class="side">
          <div class="panel" id="tower-panel">
            <p class="hint">타워를 클릭하면 정보가 보입니다.</p>
          </div>
          <div class="panel">
            <h4>시너지</h4>
            <div id="syn-tags"></div>
            <h4 class="mt">조합 시너지</h4>
            <div id="syn-combos"></div>
          </div>
        </aside>
      </main>
      <footer class="bottom">
        <div id="tower-bar" class="tower-bar"></div>
        <div class="chat">
          <div id="chat-log" class="chat-log"></div>
          <input id="chat-in" maxlength="120" placeholder="Enter로 채팅 · 우클릭으로 핑" autocomplete="off" />
        </div>
      </footer>
    </div>

    <div id="result" class="overlay hidden">
      <div class="result-box">
        <h2 id="result-title"></h2>
        <p id="result-sub"></p>
        <table id="result-table"></table>
        <button id="btn-lobby" class="primary">로비로 돌아가기</button>
        <p id="result-hint" class="hint"></p>
      </div>
    </div>
  </section>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/shared/config.js"></script>
  <script src="statues.js"></script>
  <script src="game.js"></script>
</body>
</html>
